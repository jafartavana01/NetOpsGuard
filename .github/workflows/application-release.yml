name: Publish application version
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/VERSION'
      - 'installer/**'
      - 'setup.py'
      - 'bootstrap.sh'
      - 'requirements.txt'
      - 'scripts/release.py'
  workflow_dispatch:
    inputs:
      part:
        description: Release increment (documentation-only releases must be explicit)
        type: choice
        options: [revision, patch, minor, major]
        default: revision
      publish_prepared:
        description: Tag an already merged version PR (protected main)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - name: Verify release
        run: |
          python -m unittest discover -s tests/platform -p 'test_*.py'
          python tests/f03/run.py
          python tests/test_security_rbac.py
          python tests/test_public_metadata.py
      - name: Publish version and tag together
        env:
          RELEASE_PART: ${{ inputs.part || 'revision' }}
          RELEASE_EVENT: ${{ github.event_name }}
          PUBLISH_PREPARED: ${{ inputs.publish_prepared || false }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$PUBLISH_PREPARED" = true ]; then
            python scripts/release.py --publish-prepared
          elif [ "$RELEASE_EVENT" = push ]; then
            python scripts/release.py --automatic
          else
            python scripts/release.py --part "$RELEASE_PART"
          fi
